<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Farklı CSS Kutu Modeli Örneği</title>
<style>
    body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .kutu {
            box-sizing: border-box; /* Padding ve border boyuta dahil olsun */
            width: 320px;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .kutu:hover {
            transform: translateY(-5px); /* Üzerine gelince hafif yukarı kalkar */
        }
        .kutu-5 {
            background-color: #1e1e2e;
            color: #cdd6f4;
            border: 1px solid #313244;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .kutu-5 h3 { color: #cba6f7; margin-top: 0; }
</style>
</head>
<!-- 5. Kutu -->
    <div class="kutu kutu-5">
        <h3>5. Gece Modu (Dark)</h3>
        <p>Karanlık temalar için özel mor/lacivert tonlu kutu.</p>
    </div>
</body>
</html>
