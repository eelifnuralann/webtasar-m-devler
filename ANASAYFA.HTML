<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-TİCARET</title>
<style>
        /* Genel Sayfa Sıfırlama */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header 
         
            header {
            height: 150px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        nav {

            height: 80px;

        }
             
        
        header {
            height: 150px;
            background-color: #1d4665;
            color: rgb(222, 39, 39);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            height: 80px;
            background-color: #e946de;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        /* Tahtada yazan "p:hover" gibi menüye gelince renk değişimi */
        nav a:hover {
            background-color: #e74c3c;
        }

        main {
            flex: 1;
            padding: 30px;
            background-color: #ffffff;
            width: 80%;
            margin: 20px auto;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        footer {
            height: 80px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Header (150px) -->
    <header>
        SİTE BAŞLIĞI / BANNER (150px)
    </header>

    <!-- Navigasyon Menüsü (80px) -->
    <nav>
        <a href="#">Ana Sayfa</a>
        <a href="#">Hakkımızda</a>
        <a href="#">Hizmetler</a>
        <a href="#">İletişim</a>
    </nav>

    <!-- Ana İçerik (Main Content) -->
    <main>
        <h2>Ana İçerik Bölümü</h2>
        <p>Tahtadaki kutu modeline göre hazırlanan orta gövde alanıdır. Buraya istediğin içerikleri, yazıları ve kartları ekleyebilirsin.</p>
    </main>

    <!-- Footer (80px) -->
    <footer>
        © 2026 Tüm Hakları Saklıdır | Footer (80px)
    </footer>

</body>
</html>
