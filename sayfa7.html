<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
        /* Genel Sayfa Stili */
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .kutu {
            box-sizing: border-box; /* Padding ve border boyuta dahil olsun */
            width: 320px;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .kutu:hover {
            transform: translateY(-5px); /* Üzerine gelince hafif yukarı kalkar */
        }
        .kutu-7 {
            background-color: #fff9db;
            border: 2px dashed #f59f00;
        }
        .kutu-7 h3 { color: #e67700; margin-top: 0; }
</style>
</head>
<div class="kutu kutu-7">
        <h3>7. Kesikli Çerçeveli</h3>
        <p>Sarı tonlarında kesikli (dashed) kenarlıklı not kartı modeli.</p>
    </div>
</body>
</html>
